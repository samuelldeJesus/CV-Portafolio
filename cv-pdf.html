<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currículo profissional</title>

    <link rel="stylesheet" href="pdf-style.css?v=3">

    <!-- Librería para generar y descargar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <main id="curriculum-pdf">

        <!-- CABECERA -->
        <header class="cv-header">

            <!-- Foto centralizada verticalmente em relação a nome + profissão -->
            <div class="cv-top">

                <img id="cv-foto" class="cv-foto" src="" alt="Fotografia">

                <div class="cv-presentacion">
                    <h1 id="cv-nombre"></h1>
                    <p id="cv-profesion" class="profesion"></p>
                </div>

            </div>

            <!-- Contatos abaixo -->
            <div class="contactos">
                <p id="cv-telefono"></p>
                <p id="cv-email"></p>
                <p id="cv-nacionalidad"></p>
                <p id="cv-idioma"></p>
            </div>

        </header>

        <section id="seccion-perfil">
            <h2>Perfil profesional</h2>
            <p id="cv-perfil"></p>
        </section>

        <section id="seccion-experiencia">
            <h2>Experiência profesional</h2>
            <div id="cv-experiencias"></div>
        </section>

        <section id="seccion-estudios">
            <h2>Formmación</h2>
            <div id="cv-estudios"></div>
        </section>

        <section id="seccion-habilidades">
            <h2>Competências profissionales</h2>
            <div id="cv-habilidades" class="habilidades"></div>
        </section>

        <section id="seccion-proyectos">
            <h2>Áreas de atuación</h2>
            <div id="cv-proyectos"></div>
        </section>

    </main>

</body>
</html>
